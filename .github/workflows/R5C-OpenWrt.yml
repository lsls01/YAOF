name: R5C firmware

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build again even when repository-owned inputs are unchanged'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'profiles/**'
      - 'files/**'
      - 'tests/**'
      - '.github/workflows/R5C-OpenWrt.yml'

permissions:
  contents: read

concurrency:
  group: r5c-firmware
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout accepted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check local automation and ensure zstd
        run: |
          python3 -m unittest discover -s tests -v
          bash -n scripts/build.sh
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zstd
          fi

      - name: Resolve latest compatible stable release
        id: resolve
        run: python3 scripts/firmware.py resolve

      - name: Cache verified ImageBuilder archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/imagebuilder
          key: ${{ runner.os }}-r5c-imagebuilder-${{ steps.resolve.outputs.ib_sha256 }}

      - name: Merge safe upstream changes and compare own repository state
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force_build || false }}
        run: |
          if [ "$FORCE_BUILD" = 'true' ]; then
            python3 scripts/firmware.py check --force
          else
            python3 scripts/firmware.py check
          fi
          {
            echo '### R5C update check'
            echo 'Inputs are compared with .state/r5c.json in this repository.'
            echo 'Unchanged successful inputs skip compilation and release creation.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install build host dependencies
        if: steps.check.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential zstd curl wget jq file rsync \
            libncurses5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc

      - name: Assemble R5C without silently dropping packages
        if: steps.check.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          YAOF_OUTPUT_PREFIX: ${{ steps.check.outputs.tag }}
          YAOF_STRICT_PACKAGES: '1'
          YAOF_FEED_KEY_FILE: .build/custom-feed.rsa.pub
          YAOF_CLEAN_OVERLAY_FILE: .build/clean-overlay.sh
          YAOF_RELEASE_FILE: .build/yaof-release.json
        run: |
          YAOF_IMAGEBUILDER_ARCHIVE="$(python3 -c 'import json; print(json.load(open(".build/inputs.json"))["ib_archive"])')"
          export YAOF_IMAGEBUILDER_ARCHIVE
          rm -rf artifact
          bash scripts/build.sh rockchip armv8 friendlyarm_nanopi-r5c packages.rockchip "$VERSION"

      - name: Verify images, eBPF inputs and upstream tuning
        if: steps.check.outputs.changed == 'true'
        run: python3 scripts/firmware.py verify

      - name: Upload verified release inputs
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r5c-release
          path: artifact/*
          if-no-files-found: error
          retention-days: 7

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r5c-failure-diagnostics
          path: |
            build_*/build.log
            .build/inputs.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download verified assets without executing them
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: r5c-release
          path: incoming

      - name: Validate assets and source identities
        id: assets
        run: python3 scripts/firmware.py validate-publication --directory incoming

      - name: Publish immutable prerelease and record successful state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_BASE: ${{ github.sha }}
          BASE_SHA: ${{ steps.assets.outputs.base_sha }}
          UPSTREAM_SHA: ${{ steps.assets.outputs.upstream_sha }}
          SOURCE_TREE: ${{ steps.assets.outputs.source_tree }}
          TAG: ${{ steps.assets.outputs.tag }}
        run: |
          [ "$BASE_SHA" = "$EXPECTED_BASE" ] || { echo 'Unexpected build base'; exit 1; }
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          [ "$current" = "$BASE_SHA" ] || { echo 'main advanced during build; retry'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-edit "$UPSTREAM_SHA"
          [ "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE" ] || { echo 'Source tree differs from verified build'; exit 1; }
          git push origin HEAD:main
          gh release create "$TAG" --repo "$REPOSITORY" --draft --prerelease --latest=false \
            --target "$(git rev-parse HEAD)" --title "$TAG" --notes-file incoming/release-notes.md \
            incoming/*.img.gz incoming/build-info.json incoming/kernel.config \
            incoming/packages.manifest incoming/sha256sums incoming/release-notes.md
          gh release edit "$TAG" --repo "$REPOSITORY" --draft=false
          mkdir -p .state
          cp incoming/build-info.json .state/r5c.json
          git add -- .state/r5c.json
          git commit -m "Record successful R5C firmware build $TAG"
          git push origin HEAD:main
          {
            echo '### Firmware published'
            echo "https://github.com/$REPOSITORY/releases/tag/$TAG"
            echo 'Hardware acceptance remains unverified; this build is a prerelease.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fast-forward verified upstream mirror
        continue-on-error: true
        env:
          UPSTREAM_SHA: ${{ steps.assets.outputs.upstream_sha }}
        run: |
          mirror_branch=$(python3 -c 'import json; print(json.load(open("profiles/r5c.json"))["upstream_branch"])')
          [ "$mirror_branch" != main ] || { echo 'Refusing to overwrite the customized main branch'; exit 1; }
          git check-ref-format "refs/heads/$mirror_branch"
          if ! git push origin "$UPSTREAM_SHA:refs/heads/$mirror_branch"; then
            echo '::warning::Upstream mirror requires manual history review; published firmware is unchanged.'
            echo 'Mirror sync was refused. Preserve the previous mirror and review upstream history before retrying.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Upstream mirror $mirror_branch now points to $UPSTREAM_SHA." >> "$GITHUB_STEP_SUMMARY"
